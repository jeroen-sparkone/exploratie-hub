// S1: het woord op de grond
function albarizaLabel(t) {
  const a = ss(seg(t, 1.0, 1.6)) * (1 - ss(seg(t, 5.6, 6.4))); if (a <= 0) return;
  const [x, y] = scr(geo(...ALB, .02));
  const lx = Math.min(Math.max(x, 260), Wd - 260), ly = clamp(y - 210, TOP_SAFE + 120, SUB_Y - 260);
  dot(x, y, 5, C.light, a); line([[x, y - 6], [lx, ly + 70]], 'rgba(246,238,224,.8)', 1.4, a * ss(seg(t, 1.2, 1.8)));
  txt('ALBARIZA', lx, ly, { size: 96, w: 600, sp: 14, col: C.light, a, id: 'alb' });
  txt('WITTE KALKMERGEL', lx, ly + 62, { size: 28, w: 500, sp: 7, col: C.dim, a: a * ss(seg(t, 1.6, 2.2)), id: 'alb2' });
}

// S2: drie pins en de afstanden
function cities(t) {
  const out = 1 - ss(seg(t, 30.6, 31.6)) * .55;
  for (const k in CITY) {
    const c = CITY[k], a = ss(seg(t, c.t, c.t + .4)) * out; if (a <= 0) continue;
    const [x, y, z] = scr(geo(...c.ll, .05)); if (z > 1) continue;
    rings(x, y, c.t, t, a); dot(x, y, 6, C.amber, a);
    const big = t < 31 ? 1 : 0, left = k === 'SANLUCAR';
    const nw = tw(c.name, 38, 600, 5); let lx = x + (left ? -18 : 18); const al = left ? 'right' : 'left';
    lx = left ? Math.max(lx, 40 + nw) : Math.min(lx, Wd - 40 - nw);
    txt(c.name, lx, y - 22, { size: k === 'SANLUCAR' && t > 18.2 && t < 31 ? 50 : 38, w: 600, sp: 5, align: al, col: C.light, a: a * (big ? 1 : .8), id: 'c' + k });
    txt(c.sub, lx, y + 12, { size: 20, w: 500, sp: 4, align: al, col: C.dim, a: a * ss(seg(t, c.t + .2, c.t + .7)) * (t < 18.2 ? 1 : 0), id: 'cs' + k });
  }
  for (const E of EDGES) {
    const a = ss(seg(t, E.t + .3, E.t + .8)) * (1 - ss(seg(t, 14.4, 15.0))); if (a <= 0) continue;
    const [x, y] = scr(geo(...E.mid, .05));
    txt(Math.round(E.km) + ' KM', x, y + (E.a === 'PUERTO' ? 0 : 0), { size: 30, w: 600, sp: 3, col: C.light, a, id: 'km' + E.a });
  }
}

// S3/S5: de namen van de winden, op zee en boven het land
function winds(t) {
  const p = ss(seg(t, 14.2, 14.8)) * (1 - ss(seg(t, 19.0, 19.8)));
  if (p > 0) { const [x, y] = scr(geo(-6.95, 36.74, 1)); const X = clamp(x, 120, Wd - 360), Y = clamp(y, TOP_SAFE + 80, SUB_Y - 200);
    txt('PONIENTE', X, Y, { size: 64, w: 600, sp: 10, align: 'left', col: '#ffd08a', a: p, id: 'poni' });
    txt('WEST · KOEL EN VOCHTIG', X + 2, Y + 48, { size: 24, w: 500, sp: 5, align: 'left', col: C.amberSoft, a: p * ss(seg(t, 14.6, 15.2)), id: 'poni2' }); }
  const l = ss(seg(t, 32.4, 33.0)) * (1 - ss(seg(t, 36.6, 37.2)));
  if (l > 0) { const [x, y] = scr(geo(-5.62, 36.66, 1)); const X = clamp(x, 120, Wd - 360), Y = clamp(y, TOP_SAFE + 80, SUB_Y - 200);
    txt('LEVANTE', X, Y, { size: 64, w: 600, sp: 10, align: 'left', col: C.teal, a: l, id: 'leva' });
    txt('OOST · HEET EN DROOG', X + 2, Y + 48, { size: 24, w: 500, sp: 5, align: 'left', col: '#cfeff2', a: l * ss(seg(t, 32.8, 33.4)), id: 'leva2' }); }
}

// S4: Sanlúcar en de regel
function sanlucar(t) {
  const c = CITY.SANLUCAR, [x, y] = scr(geo(...c.ll, .05));
  const a = ss(seg(t, 23.2, 23.6)) * (1 - ss(seg(t, 30.6, 31.2))); if (a > 0) { rings(x, y, 23.2, t, a, C.amber, 150); rings(x, y, 24.0, t, a * .7, C.amber, 150); }
  const m = ss(seg(t, 28.5, 29.1)) * (1 - ss(seg(t, 32.1, 32.6))); if (m <= 0) return;
  const X = 96, Y = TOP_SAFE + 150;
  g.save(); g.globalAlpha = m; g.fillStyle = C.amber; g.fillRect(X - 26, Y - 46, 4, 150); g.restore();
  txt('MANZANILLA', X, Y, { size: 72, w: 600, sp: 8, align: 'left', col: C.light, a: m, id: 'manz' });
  txt('RIJPT ALLEEN IN SANLÚCAR', X + 2, Y + 56, { size: 28, w: 600, sp: 5, align: 'left', col: C.amberSoft, a: m, id: 'manz2' });
  txt('REGEL VAN DE CONSEJO REGULADOR', X + 2, Y + 90, { size: 20, w: 500, sp: 4, align: 'left', col: C.dim, a: m, id: 'manz3' });
}

// S6: het oppervlak, dan de eindkaart
function hectares(t) {
  const a = ss(seg(t, 36.6, 37.2)) * (1 - ss(seg(t, 40.4, 40.9))); if (a <= 0) return;
  const X = Wd / 2, Y = TOP_SAFE + 170;
  txt('6.867', X, Y, { size: 150, w: 600, sp: 2, col: '#ffd08a', a, id: 'ha' });
  txt('HECTARE WIJNGAARD IN DE DO', X, Y + 100, { size: 30, w: 600, sp: 5, col: C.light, a, id: 'ha2' });
  txt('ALLE BODEMS · CONSEJO REGULADOR 2025', X, Y + 140, { size: 20, w: 500, sp: 3.5, col: C.dim, a, id: 'ha3' });
}
function endCard(t) {
  const a = ss(seg(t, 40.4, 41.0)); if (a <= 0) return;
  const e = eo(seg(t, 40.4, 41.2));
  g.save(); g.globalAlpha = a * .55; g.fillStyle = '#05080c'; g.fillRect(0, 0, Wd, Ht); g.restore();
  const X = 90, Y = Ht * .36, BW = (Wd - 180) * e;
  g.save(); g.globalAlpha = a; g.fillStyle = '#8b0018'; g.fillRect(X, Y, BW, 330); g.restore();
  if (e > .6) {
    const k = ss(seg(t, 40.9, 41.4));
    txt('SHERRY-', X + 50, Y + 92, { size: 84, w: 900, f: 'NotoSerif', align: 'left', col: '#fff8f0', a: a * k, id: 'e1' });
    txt('DRIEHOEK', X + 50, Y + 182, { size: 84, w: 900, f: 'NotoSerif', align: 'left', col: '#fff8f0', a: a * k, id: 'e2' });
    txt('LEES DE GIDS OP VINOVONK.COM', X + 52, Y + 270, { size: 30, w: 600, sp: 4, align: 'left', col: '#fff8f0', a: a * ss(seg(t, 41.2, 41.7)), id: 'e3' });
  }
  txt('@VINOVONK', Wd / 2, Y + 420, { size: 30, w: 600, sp: 6, col: C.light, a: a * ss(seg(t, 41.5, 42.0)), id: 'e4' });
}

// ondertitels: één NL-regel (zo nodig twee), links als een kaartlegenda
function wrap(s, size, max) { const words = s.split(' '); const out = ['']; for (const w of words) { const tryS = out[out.length - 1] ? out[out.length - 1] + ' ' + w : w;
  if (tw(tryS, size, 500, 1) > max && out[out.length - 1]) out.push(w); else out[out.length - 1] = tryS; } return out; }
function subtitles(t) {
  const c = CUES.find(c => t >= c.t0 - .12 && t < c.t1 + .12);
  g.save(); const gr = g.createLinearGradient(0, SUB_Y - 160, 0, Ht); gr.addColorStop(0, 'rgba(6,10,15,0)'); gr.addColorStop(.5, 'rgba(6,10,15,.45)'); gr.addColorStop(1, 'rgba(6,10,15,.6)');
  g.fillStyle = gr; g.fillRect(0, SUB_Y - 160, Wd, Ht - SUB_Y + 160); g.restore();
  if (!c || t > 40.3) return;
  const a = ss(seg(t, c.t0 - .12, c.t0 + .08)) * (1 - ss(seg(t, c.t1 - .08, c.t1 + .12)));
  const X = 96, L = wrap(c.text, 44, Wd - 96 - 150), Y = SUB_Y - (L.length - 1) * 54;
  g.save(); g.globalAlpha = a; g.fillStyle = C.amber; g.fillRect(X - 24, Y - 28, 4, 56 + (L.length - 1) * 54); g.restore();
  L.forEach((s, i) => txt(s, X, Y + i * 54, { size: 44, w: 500, sp: 1, align: 'left', col: C.light, a, id: 'sub' + i, nobox: true }));
}
function credits(t) {
  const a = ss(seg(t, .6, 1.4)) * (1 - ss(seg(t, 40.3, 40.7)));
  const o = { size: 15, w: 500, sp: 1.6, align: 'right', col: 'rgba(240,232,216,.6)', a, nobox: true };
  txt('HOOGTE AWS TERRAIN TILES · BEELD SENTINEL-2 CLOUDLESS 2016 BY EOX (CC BY 4.0)', Wd - 40, TOP_SAFE - 40, { ...o, id: 'cr1' });
  txt('HOOGTE ×4 · WINDLIJNEN SCHEMATISCH', Wd - 40, TOP_SAFE - 16, { ...o, id: 'cr2' });
}

// ---------- het beeld op filmtijd t ----------
function frame(t) {
  TX = [];
  const dist = setCamera(t);
  g.setTransform(2, 0, 0, 2, 0, 0); g.clearRect(0, 0, Wd, Ht);
  // driehoek: ontbrandt met een heldere kop, blijft zacht staan
  for (const E of EDGES) { const k = eo(seg(t, E.t, E.t + 1.0)), fade = 1 - ss(seg(t, 17.6, 18.6)) * .6;
    for (const r of [E.glow, E.core]) rv(r, { revB: k * r.L, head: k * r.L, headAmt: r === E.core ? 1.4 * (1 - ss(seg(k, .8, 1))) : 0, inten: (t >= E.t ? 1 : 0) * fade, soft: 1.2 }); }
  // poniente: 13.6 → 31, zacht tot het slot; levante: 31.8 → einde
  for (const W of PONI) { const k = eio(seg(t, 13.6 + W.d, 16.4 + W.d)), on = (1 - ss(seg(t, 31.2, 32.4)) * .75) * (1 - ss(seg(t, 40.4, 41.1)) * .7);
    const low = 1 + .9 * (1 - ss(seg(dist, 30, 60)));
    for (const r of [W.glow, W.core]) rv(r, { revB: k * r.L, inten: (t >= 13.6 ? 1 : 0) * on * low, flowPh: t * 22, soft: 6, pxW: r === W.core ? 2.2 * low : 9 * low }); }
  for (const W of LEVA) { const k = eio(seg(t, 31.8 + W.d, 34.4 + W.d)), on = 1 - ss(seg(t, 40.4, 41.1)) * .7;
    for (const r of [W.glow, W.core]) rv(r, { revB: k * r.L, inten: (t >= 31.8 ? 1 : 0) * on, flowPh: t * 20, soft: 6 }); }
  post.dof.focus = dist; post.dof.aper = dist * (t < 6 ? 5 : 4.5);
  post.bloom.strength = .55;
  VU.fade.value = ss(seg(t, 0, .5));
  post.composer.render();
  mapLabels(t); albarizaLabel(t); cities(t); winds(t); sanlucar(t); hectares(t);
  if (!Q.has('nosubs')) subtitles(t);
  credits(t); endCard(t);
}

window.DUR = T1 - T0;
window.render = t => frame(t + T0);
window.TEXTS = t => { window.render(t); return TX.map(o => ({ ...o })); };
const EVF = [
  { t: 0, type: 'air' }, { t: 1.0, type: 'word' }, { t: 4.2, type: 'rise' },
  ...Object.values(CITY).map((c, i) => ({ t: c.t, type: 'pin', i })), ...EDGES.map((E, i) => ({ t: E.t, type: 'ignite', i })),
  { t: 12.8, type: 'whoosh' }, { t: 13.6, type: 'poniente' }, { t: 18.2, type: 'dive' }, { t: 23.2, type: 'ring' },
  { t: 27.7, type: 'silence' }, { t: 28.5, type: 'rule' }, { t: 31.0, type: 'orbit' }, { t: 31.8, type: 'levante' },
  { t: 36.4, type: 'rise' }, { t: 36.6, type: 'stat' }, { t: 40.4, type: 'card' }];
window.EV = EVF.map(e => ({ ...e, t: e.t - T0 })).filter(e => e.t >= 0 && e.t <= T1 - T0);
window.render(0);
window.READY = true;
</script>
